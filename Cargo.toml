[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/craftcenter", "apps/craftcenter-cli", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
rust-version = "1.90"
repository = "https://github.com/avokadosauce/craftcenter"

[workspace.dependencies]
# internal
craftcenter-catalogue = { path = "crates/catalogue" }
craftcenter-verify = { path = "crates/verify" }
craftcenter-select = { path = "crates/select" }
craftcenter-releases = { path = "crates/releases" }
craftcenter-install = { path = "crates/install" }
craftcenter-core = { path = "crates/core" }
craftcenter-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
ureq = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "7"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
