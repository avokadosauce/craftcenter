# The CraftCenter catalogue: every app CraftCenter can install, one table per app.
#
# Adding a Crafting App is one `[[app]]` row and nothing else — no code change. Fields:
#
#   slug         machine name; the CLI argument, the install directory, the state key
#   name         display name, in the upstream's {Function}Craft spelling
#   tagline      one line, in the publisher's own words where they have published one
#   repo         "<owner>/<repo>" on github.com; the only host CraftCenter talks to
#   app_id       the upstream's reverse-DNS id, used for the Linux .desktop file name
#   binary       the executable inside the release asset
#   cli          the optional headless binary, when the release ships one
#   asset_stems  the filename stems to look for, newest first. NOT always the repo name:
#                every published pdfcraft release is named printcraft-*, while the
#                packaging scripts on its main branch already emit pdfcraft-*. Selection
#                matches the release's real asset list, so both can be listed safely.
#   icon         path under assets/app-icon/, copied from the app's own repo (its
#                assets/app-icon/LICENSE.txt licenses it MIT OR Apache-2.0)
#   kind         "app" for an installable app, "self" for CraftCenter itself
#
# The engine, storytold/artcraft, is deliberately absent: it is not one of the creative
# suite apps, its releases have a different shape, and it publishes no SHA256SUMS.txt.

schema = 1

[[app]]
slug = "craftcenter"
name = "CraftCenter"
tagline = "This installer"
repo = "avokadosauce/craftcenter"
app_id = "io.github.avokadosauce.craftcenter"
binary = "craftcenter"
cli = "craftcenter-cli"
asset_stems = ["craftcenter"]
kind = "self"

[[app]]
slug = "photocraft"
name = "PhotoCraft"
tagline = "Image editing: layers, masks, type and real PSD files"
repo = "storytold/photocraft"
app_id = "ai.storyteller.photocraft"
binary = "photocraft"
cli = "photocraft-cli"
asset_stems = ["photocraft"]
icon = "photocraft-64.png"
site = "https://getartcraft.com/apps/photocraft"

