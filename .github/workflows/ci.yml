name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel an in-flight run when a PR gets pushed again; a run on a
  # plain branch push should be left to finish so its result is trustworthy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation mostly helps local edit/rebuild loops; on a
  # fresh CI checkout it just adds overhead and cache size for no benefit.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # egui/eframe/winit talk to the windowing system directly, so even a
      # headless build on Linux needs these development headers to link.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo xtask layers
        run: cargo xtask layers

      # `cargo xtask catalogue --check` (no --offline) talks to GitHub to
      # check the catalogue against upstream releases, which a PR from an
      # untrusted fork should not be made to do as part of CI, and which
      # would make this job flaky on rate limits regardless. The offline
      # check below validates the catalogue's own shape (schema, required
      # fields, no duplicate slugs) without any network access; the
      # live-drift check is a separate, manually-run concern.
      - name: cargo xtask catalogue --check-offline
        run: cargo xtask catalogue --check-offline
